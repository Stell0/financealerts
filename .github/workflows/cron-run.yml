name: Daily RSI alerts

on:
  schedule:
    - cron: '0 14 * * *'
      timezone: America/New_York
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print alerts without Telegram delivery or commits
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: financealerts-write
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Check out FinanceAlerts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build this checkout
        run: docker build -t financealerts:daily .
      - name: Validate offline behavior
        run: >-
          docker run --rm -e PYTHONPATH=/app/src
          -v "$GITHUB_WORKSPACE/tests:/app/tests:ro"
          -v "$GITHUB_WORKSPACE/scripts:/app/scripts:ro"
          financealerts:daily python -m unittest discover -s tests -v
      - name: Scan independent daily prices and deliver new alerts
        id: scan
        continue-on-error: true
        env:
          TICKER_LIST: ${{ vars.TICKER_LIST }}
          RSI_lower: ${{ vars.RSI_LOWER || '30' }}
          RSI_upper: ${{ vars.RSI_UPPER || '70' }}
          TELEGRAM_CHAT_ID: ${{ (github.event_name == 'schedule' || !inputs.dry_run) && secrets.TELEGRAM_CHAT_ID || '' }}
          TELEGRAM_BOT_TOKEN: ${{ (github.event_name == 'schedule' || !inputs.dry_run) && secrets.TELEGRAM_BOT_TOKEN || '' }}
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/app" -w /app
          -e TICKER_LIST -e RSI_lower -e RSI_upper
          -e TELEGRAM_CHAT_ID -e TELEGRAM_BOT_TOKEN
          financealerts:daily
      - name: Commit successful deliveries and changed local caches
        if: ${{ always() && (steps.scan.outcome == 'success' || steps.scan.outcome == 'failure') && (github.event_name == 'schedule' || !inputs.dry_run) }}
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          bash scripts/commit_runtime.sh
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin "HEAD:$TARGET_BRANCH"
      - name: Report scan or delivery failures after saving partial progress
        if: ${{ always() && steps.scan.outcome == 'failure' }}
        run: exit 1

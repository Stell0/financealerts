name: Offline tests and Docker build

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: financealerts-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t financealerts:test .
      - name: Run offline unit and integration tests without credentials
        run: >-
          docker run --rm -e PYTHONPATH=/app/src
          -v "$GITHUB_WORKSPACE/tests:/app/tests:ro"
          -v "$GITHUB_WORKSPACE/scripts:/app/scripts:ro"
          financealerts:test python -m unittest discover -s tests -v
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install pinned dashboard and browser test dependencies
        run: npm ci --prefix site
      - name: Build static dashboard from committed data
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/app" -w /app
          financealerts:test python scripts/build_site.py --output site/public
      - name: Verify real chart rendering and navigation
        working-directory: site
        run: |
          npx playwright install --with-deps chromium
          npm test

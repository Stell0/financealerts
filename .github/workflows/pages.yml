name: Publish RSI dashboard

on:
  push:
    branches: [main]
    paths: ['config/**', 'data/**', 'site/**', 'src/**', 'scripts/build_site.py', 'requirements.txt', 'Dockerfile', '.github/workflows/pages.yml']
  workflow_dispatch:
  # GITHUB_TOKEN runtime pushes do not trigger push workflows. Completion does,
  # including failed scans that successfully persisted partial market progress.
  workflow_run:
    workflows: ['Daily RSI alerts']
    branches: [main]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: financealerts-pages
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read the current committed main, including newly pushed runtime data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Build the pinned Python runtime
        run: docker build -t financealerts:pages .
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --prefix site --omit=dev
      - name: Generate static assets without provider reads or credentials
        env:
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL || 'https://stell0.github.io/financealerts/' }}
          RSI_lower: ${{ vars.RSI_LOWER || '30' }}
          RSI_upper: ${{ vars.RSI_UPPER || '70' }}
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/app" -w /app
          -e SITE_BASE_URL -e RSI_lower -e RSI_upper
          financealerts:pages python scripts/build_site.py --output site/public
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site/public
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
